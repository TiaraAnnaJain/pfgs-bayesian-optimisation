[project]
name = "pfgs-bo"
version = "0.1.0"
description = "Pareto Front Guided Sampling (PFGS) principles in Bayesian optimisation: PFGS-guided UCB beta schedules and constrained BO."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tiara Anna Jain" }]
keywords = [
    "bayesian-optimisation",
    "gaussian-process",
    "pareto-front",
    "multi-objective-optimisation",
    "constrained-optimisation",
    "botorch",
]
dependencies = [
    "botorch>=0.17.2",
    "gpytorch>=1.15.2",
    "matplotlib>=3.10.8",
    "mlflow>=3.13.0",
    "numpy>=2.4.3",
    "pandas>=2.3.3",
    "pymoo>=0.6.1.6",
    "pyswarms>=1.3.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "torch>=2.10.0",
]

[project.urls]
Repository = "https://github.com/TiaraAnnaJain/pfgs-bayesian-optimisation"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pfgs_bo"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["pfgs_bo"]

[tool.mypy]
python_version = "3.13"
files = ["src", "scripts"]
ignore_missing_imports = true
check_untyped_defs = true
# Dataset fields are Optional until validated by Dataset.check(); checking every
# use for None would add an assert per line, so None is treated as compatible.
strict_optional = false

[tool.pytest.ini_options]
testpaths = ["tests"]

# On Linux (e.g. CI), install the CPU-only PyTorch build instead of the much
# larger CUDA build. macOS and Windows use the default PyPI wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
# Keep the same PyTorch version on every platform.
constraint-dependencies = ["torch==2.10.*"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
