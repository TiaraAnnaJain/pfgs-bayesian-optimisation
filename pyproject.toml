dependencies = [
    "botorch>=0.17.2",
    "click==8.3.1",
    "filelock==3.25.2",
    "fsspec==2026.2.0",
    "gpytorch>=1.15.2",
    "iniconfig==2.3.0",
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    "mpmath==1.3.0",
    "networkx==3.6.1",
    "numpy==2.4.3",
    "packaging==26.0",
    "pathspec==1.0.4",
    "platformdirs==4.9.4",
    "pluggy==1.6.0",
    "pygments==2.19.2",
    "pytokens==0.4.1",
    "scipy==1.17.1",
    "setuptools==82.0.1",
    "sympy==1.14.0",
    "torch==2.10.0",
    "typing-extensions==4.15.0",
]

[tool.black]
target-version = ["py313"]
line-length = 88

[dependency-groups]
