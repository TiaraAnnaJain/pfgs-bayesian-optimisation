# Pareto Front Guided Sampling. Run with scripts/run_pfgs.py.
# Any value can be overridden with --set key=value.

test_name = "PFGS"
method = "PFGS"
num_iter = 95

# Problem
problem = "himmelblau"      # himmelblau | branin | ackley; or --problem
dimensions = 2              # only Ackley supports other values; or --dimensions

# Data
train_samples = 5
test_samples = 100
delta = 1.5
train_seed = 1
test_seed = 11

model_seed = 11
optimiser_seed = 0

# Discard thresholds
mean_discard_threshold = 0
std_dev_discard_threshold = 0

[nsga_parameters]
population_size = 100
number_of_generations = 10
