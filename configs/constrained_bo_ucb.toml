# Constrained BO with UCB, optimised with PSO. Run with scripts/run_constrained_bo.py.
# Any value can be overridden with --set key=value.

test_name = "constrained-BO-UCB"
method = "constrained-BO"
num_iter = 95
acquisition_function = "UCB"
beta = 1.96

# Problem
problem = "himmelblau"      # himmelblau | branin | ackley; or --problem
dimensions = 2              # only Ackley supports other values; or --dimensions

# Data
train_samples = 5
test_samples = 100
delta = 1.5
train_seed = 1
test_seed = 11

model_seed = 11
optimiser_seed = 0

# Discard thresholds
mean_discard_threshold = 1000
std_dev_discard_threshold = 100
