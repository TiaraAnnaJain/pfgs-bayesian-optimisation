# Standard BO with expected improvement. Run with scripts/run_bo.py.
# Any value can be overridden with --set key=value.

test_name = "BO-EI"
method = "BO"
num_iter = 95
acquisition_function = "EI"

# Problem
problem = "himmelblau"      # himmelblau | branin | ackley; or --problem
dimensions = 2              # only Ackley supports other values; or --dimensions

# Data
train_samples = 5
test_samples = 100
delta = 1.5
train_seed = 1
test_seed = 11

model_seed = 11

[optimizer_parameters]
num_restarts = 20
raw_samples = 512
q = 1
